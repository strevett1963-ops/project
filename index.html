<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple 3D FPS Arena</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <div class="panel">
      <div class="label">Player</div>
      <div class="meter"><div id="playerHealth"></div></div>
    </div>
    <div class="panel center-panel">
      <div id="status">Loading arena...</div>
      <div id="controls">Arrow keys: move and turn | Space: shoot</div>
    </div>
    <div class="panel">
      <div class="label">Opponent</div>
      <div class="meter"><div id="enemyHealth"></div></div>
    </div>
  </div>
  <div id="crosshair" aria-hidden="true"></div>
  <div id="overlay">
    <div id="message">Simple 3D FPS Arena</div>
    <p id="summary">Defeat the computer opponent before it lands enough shots on you.</p>
    <button id="restart">Start Game</button>
  </div>
  <script src="main.js"></script>
</body>
</html>
